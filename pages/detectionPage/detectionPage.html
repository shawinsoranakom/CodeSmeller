<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detection Page</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>Code Smeller (Powered by CodeBERT)</h1> 

    <div class="container">
        <div class="row">
            <div class="col">
                <div class="input-group mb-3">
                    <input type="file" class="form-control" id="uploadPyFile">
                </div>
                <textarea 
                        id="pythonCode" 
                        name="pythonCode" 
                        rows="10" 
                        cols="50" 
                        placeholder="Paste python code here!"
                        
                        style="font-family: monospace; background-color: #f4f4f4; padding:20px;"></textarea>
                    
                <div id="BtnWrap">
                    <button type="button" class="btn" id="detectBtn">Begin Detection</button>
                    <button type="button" class="btn" id="clearCodeBtn">Clear</button>
                </div>
            </div>
            <div class="col">
                <p>Detection Result</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="detectionScript.js"></script>
</body>
</html>
